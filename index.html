<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniel Chen 虛擬資產研究</title>
<meta name="description" content="追蹤全球虛擬資產、穩定幣與代幣化法規，整理台灣銀行的因應做法。個人研究筆記。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
:root{
  --paper:#ffffff; --surface:#f4f5f2; --ink:#000000; --muted:#53565a; --rule:#d0d0ce;
  --accent:#2c7a0c; --bright:#86bc25; --accent-soft:#eef6dc;
  --p0:#b3261e; --p1:#8a5a00; --p2:#53565a;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;
    --paper:#000000; --surface:#141414; --ink:#ffffff; --muted:#a7a8aa; --rule:#333333;
    --accent:#86bc25; --bright:#86bc25; --accent-soft:#1b2709; --p0:#ff8a80; --p1:#efb85c; --p2:#bbbcbc;}
}
*{box-sizing:border-box}
body{margin:0;border-top:8px solid var(--bright);background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.75}
a{color:var(--accent);text-underline-offset:3px}
button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:26px 18px 64px}
.mast{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between;padding-bottom:14px}
.who h1{font-family:var(--display);font-weight:900;font-size:36px;line-height:1.2;margin:0}
.who h1 span{font-size:22px;font-weight:600;margin-left:10px}
.who .role{font-weight:700;color:var(--accent);margin-top:4px}
.who .tag{color:var(--muted);font-size:14px;max-width:46ch}
.tabs{display:flex;gap:4px;border-bottom:3px double var(--ink);width:100%}
.tab{font:inherit;font-family:var(--display);font-weight:600;font-size:16.5px;border:0;background:none;color:var(--muted);padding:8px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--bright)}
.view{display:none} .view.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule)}
.nav{display:flex;flex-wrap:wrap;gap:4px 6px}
.navbtn{font:inherit;font-size:14px;border:0;background:none;color:var(--muted);padding:3px 10px;border-radius:5px;cursor:pointer}
.navbtn:hover{color:var(--ink)}
.navbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700;box-shadow:inset 0 -3px 0 var(--bright)}
.pick{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.pick select,.pick button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:4px 10px;cursor:pointer}
.pick button:disabled{opacity:.4;cursor:default}
.kick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;font-weight:700;letter-spacing:.06em}
.kick .reg{color:var(--accent)}
.kick .pri{padding:1px 8px;border-radius:4px;border:1px solid currentColor}
.P0{color:var(--p0)} .P1{color:var(--p1)} .P2{color:var(--p2)}
.lead{padding:22px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1.6fr 1fr;gap:26px}
.lead h2{font-family:var(--display);font-weight:900;font-size:31px;line-height:1.35;margin:8px 0 10px;text-wrap:balance}
.lead .lede{font-size:17px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 280px;gap:30px;padding-top:6px}
.story{padding:18px 0;border-bottom:1px solid var(--rule)}
.story h3{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.45;margin:6px 0 6px;text-wrap:balance}
.lede{margin:0 0 10px}
.bank{background:var(--accent-soft);border-left:4px solid var(--bright);padding:10px 14px;border-radius:0 6px 6px 0}
.bank h4{margin:0 0 2px;font-size:12.5px;color:var(--accent);letter-spacing:.06em}
.bank ul,.pts{margin:0;padding-left:18px}
.pts{margin:0 0 10px}
.take{margin:10px 0 0;font-size:14.5px}
.take b{color:var(--accent)}
.src{margin-top:8px;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted)}
.src .sec::after{content:"（次級）";color:var(--muted)}
details{margin-top:8px}
summary{cursor:pointer;font-size:13.5px;color:var(--accent);width:fit-content}
.rail{display:flex;flex-direction:column;gap:22px;padding-top:18px}
.box h4{font-family:var(--display);font-size:16px;margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.box ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.box time{display:block;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.box.todo ul{list-style:disc;padding-left:18px}
.foot{margin-top:26px;color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);padding:24px 0}
.intro{max-width:62ch;color:var(--muted);margin:20px 0 4px}
.thesis{display:grid;grid-template-columns:64px 1fr;gap:6px 18px;padding:24px 0;border-bottom:1px solid var(--rule)}
.thesis .n{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;color:var(--bright);font-variant-numeric:tabular-nums}
.thesis h3{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.4;margin:0 0 6px;text-wrap:balance}
.thesis p{margin:0;max-width:62ch}
.thesis .basis{margin-top:8px;font-size:13px;color:var(--muted)}
.about{display:grid;grid-template-columns:1.3fr 1fr;gap:36px;padding-top:22px}
.about h3{font-family:var(--display);font-size:18px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.about p{margin:0 0 12px;max-width:62ch}
.about section{margin-bottom:26px}
.row{padding:10px 0;border-bottom:1px solid var(--rule)}
.row b{display:block}
.row .m{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .d{font-size:14.5px}
@media (max-width:820px){.lead,.grid,.about{grid-template-columns:1fr}.who h1{font-size:28px}.lead h2{font-size:25px}.thesis{grid-template-columns:44px 1fr}.thesis .n{font-size:32px}.tab{padding:8px 10px;font-size:15.5px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="who">
      <h1 id="pname"></h1>
      <div class="role" id="prole"></div>
      <div class="tag" id="ptag"></div>
    </div>
    <nav class="tabs" aria-label="頁面">
      <button type="button" class="tab" data-v="daily">每日重點</button>
      <button type="button" class="tab" data-v="views">我的觀點</button>
      <button type="button" class="tab" data-v="about">關於我</button>
    </nav>
  </header>
  <div class="view" id="v-daily">
    <div class="bar">
      <nav class="nav" id="nav" aria-label="地區"></nav>
      <div class="pick">
        <button type="button" id="prev" aria-label="前一期">‹</button>
        <label for="edition">期別</label>
        <select id="edition"></select>
        <button type="button" id="next" aria-label="後一期">›</button>
      </div>
    </div>
    <section class="lead" id="lead"></section>
    <div class="grid">
      <main id="stories"></main>
      <aside class="rail" id="rail"></aside>
    </div>
    <p class="foot">級別：P0 需立即行動｜P1 本週內評估｜P2 觀察。來源以主管機關官方文件為主；標「次級」者為媒體或律所整理，引用前請再核實。本站為個人研究筆記，不構成法律或投資建議。</p>
  </div>
  <div class="view" id="v-views"></div>
  <div class="view" id="v-about"></div>
</div>
<script src="profile.js"></script>
<script src="editions.js"></script>
<script>
const P = window.PROFILE || {};
const ED = (window.EDITIONS || []).slice().sort((a,b) => a.date < b.date ? 1 : -1);
const state = {i:0, region:"全部"};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const WEEK = ["日","一","二","三","四","五","六"];
const label = d => { const t = new Date(d + "T00:00:00"); return isNaN(t) ? d : d + "（" + WEEK[t.getDay()] + "）"; };

(() => {
  const h = document.getElementById("pname"); h.textContent = P.name || "";
  if (P.nameZh) h.appendChild(el("span",null,P.nameZh));
  document.getElementById("prole").textContent = [P.title, P.location].filter(Boolean).join("｜");
  document.getElementById("ptag").textContent = P.tagline || "";
})();

function kicker(s, lead){
  const k = el("div","kick");
  if (lead) k.appendChild(el("span",null,"頭條"));
  k.appendChild(el("span","reg",s.region));
  k.appendChild(el("span","pri " + s.p, s.p));
  return k;
}
function bankBox(s){
  const b = el("div","bank"); b.appendChild(el("h4",null,"台灣銀行怎麼做"));
  const ul = el("ul"); s.bank.forEach(x => ul.appendChild(el("li",null,x))); b.appendChild(ul); return b;
}
function sources(s){
  const d = el("div","src"); d.appendChild(el("span",null,"來源"));
  s.links.forEach(([n,u,sec]) => { const a = el("a", sec ? "sec" : null, n); a.href = u; a.target = "_blank"; a.rel = "noopener"; d.appendChild(a); });
  return d;
}
function points(s){ const ul = el("ul","pts"); s.points.forEach(x => ul.appendChild(el("li",null,x))); return ul; }
function take(s){ const p = el("p","take"); p.appendChild(el("b",null,"評析　")); p.appendChild(document.createTextNode(s.view)); return p; }

function renderDaily(){
  const e = ED[state.i];
  const lead = document.getElementById("lead"), main = document.getElementById("stories"), rail = document.getElementById("rail"), nav = document.getElementById("nav");
  [lead, main, rail, nav].forEach(x => x.textContent = "");
  if (!e){ main.appendChild(el("p","empty","還沒有任何一期。")); return; }
  ["全部", ...Array.from(new Set(e.stories.map(s => s.region)))].forEach(r => {
    const b = el("button","navbtn",r); b.type = "button"; b.setAttribute("aria-pressed", String(state.region === r));
    b.addEventListener("click", () => { state.region = r; renderDaily(); }); nav.appendChild(b);
  });
  const list = e.stories.filter(s => state.region === "全部" || s.region === state.region);
  if (!list.length){ lead.style.display = "none"; main.appendChild(el("p","empty","這一期沒有這個地區的新聞。")); }
  else {
    lead.style.display = "";
    const top = list[0];
    const L = el("div"); L.appendChild(kicker(top, true)); L.appendChild(el("h2",null,top.headline)); L.appendChild(el("p","lede",top.lede));
    if (top.points.length) L.appendChild(points(top)); L.appendChild(take(top)); L.appendChild(sources(top));
    const R = el("div"); R.appendChild(bankBox(top));
    lead.appendChild(L); lead.appendChild(R);
    list.slice(1).forEach(s => {
      const a = el("article","story");
      a.appendChild(kicker(s)); a.appendChild(el("h3",null,s.headline)); a.appendChild(el("p","lede",s.lede));
      a.appendChild(bankBox(s));
      const det = el("details"); det.appendChild(el("summary",null,"更多重點與評析"));
      if (s.points.length) det.appendChild(points(s)); det.appendChild(take(s)); a.appendChild(det);
      a.appendChild(sources(s));
      main.appendChild(a);
    });
  }
  const box = (title, cls) => { const b = el("section","box" + (cls ? " " + cls : "")); b.appendChild(el("h4",null,title)); const ul = el("ul"); b.appendChild(ul); rail.appendChild(b); return ul; };
  const du = box("倒數提醒");
  (e.dates || []).forEach(([d,t]) => { const li = el("li"); li.appendChild(el("time",null,d)); li.appendChild(document.createTextNode(t)); du.appendChild(li); });
  const tu = box("明日追蹤","todo");
  (e.todo || []).forEach(t => tu.appendChild(el("li",null,t)));
  document.getElementById("edition").value = String(state.i);
  document.getElementById("prev").disabled = state.i >= ED.length - 1;
  document.getElementById("next").disabled = state.i <= 0;
}
const sel = document.getElementById("edition");
ED.forEach((e,i) => { const o = el("option",null,label(e.date)); o.value = String(i); sel.appendChild(o); });
sel.addEventListener("change", () => { state.i = Number(sel.value); state.region = "全部"; renderDaily(); });
document.getElementById("prev").addEventListener("click", () => { if (state.i < ED.length - 1){ state.i++; state.region = "全部"; renderDaily(); } });
document.getElementById("next").addEventListener("click", () => { if (state.i > 0){ state.i--; state.region = "全部"; renderDaily(); } });

(() => {
  const v = document.getElementById("v-views");
  v.appendChild(el("p","intro","這幾條是我目前對台灣銀行切入虛擬資產業務的判斷，會隨法規進展修正。"));
  (P.views || []).forEach((t,i) => {
    const a = el("article","thesis");
    a.appendChild(el("div","n", String(i + 1).padStart(2,"0")));
    const b = el("div"); b.appendChild(el("h3",null,t.h)); b.appendChild(el("p",null,t.p));
    if (t.basis) b.appendChild(el("div","basis","依據：" + t.basis));
    a.appendChild(b); v.appendChild(a);
  });
})();

(() => {
  const v = document.getElementById("v-about");
  const g = el("div","about"); const L = el("div"), R = el("div");
  const sec = (parent, title) => { const s = el("section"); s.appendChild(el("h3",null,title)); parent.appendChild(s); return s; };
  const row = (s, head, meta, desc) => { const r = el("div","row"); r.appendChild(el("b",null,head)); if (meta) r.appendChild(el("div","m",meta)); if (desc) r.appendChild(el("div","d",desc)); s.appendChild(r); };
  const a = sec(L,"簡介"); (P.bio || []).forEach(t => a.appendChild(el("p",null,t)));
  const w = sec(L,"研究與作品"); (P.work || []).forEach(x => row(w, x.t, null, x.d));
  const x = sec(R,"經歷"); (P.experience || []).forEach(e => row(x, e.org + "｜" + e.role, [e.when, e.where].filter(Boolean).join("　"), e.note));
  const ed = sec(R,"學歷"); (P.education || []).forEach(e => row(ed, e.org, [e.role, e.when].filter(Boolean).join("　"), e.note));
  const c = sec(R,"聯絡"); (P.links || []).forEach(([n,u]) => { const p = el("p"); const k = el("a",null,n); k.href = u; k.target = "_blank"; k.rel = "noopener"; p.appendChild(k); p.appendChild(document.createTextNode("　" + u.replace("https://www.",""))); c.appendChild(p); });
  g.appendChild(L); g.appendChild(R); v.appendChild(g);
})();

const HAS_VIEWS = (P.views || []).length > 0;
if (!HAS_VIEWS) document.querySelector('.tab[data-v="views"]').remove();
const VIEWS = HAS_VIEWS ? ["daily","views","about"] : ["daily","about"];
function show(){
  const h = location.hash.replace("#",""); const cur = VIEWS.includes(h) ? h : "daily";
  ["daily","views","about"].forEach(n => document.getElementById("v-" + n).classList.toggle("on", n === cur));
  document.querySelectorAll(".tab").forEach(t => { if (t.dataset.v === cur) t.setAttribute("aria-current","page"); else t.removeAttribute("aria-current"); });
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { location.hash = t.dataset.v; show(); }));
window.addEventListener("hashchange", show);
renderDaily(); show();
</script>
</body>
</html>
