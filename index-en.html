<style>
:root{color-scheme:dark;--bg:#000000;--ink:#ffffff;--ink2:#d6d6d6;--mute:#a7a8aa;--pill:#141414;--pill-h:#1f1f1f;--line:#333333;--accent:#86bc25;--deep:#2c7a0c;--soft:#1b2709;--glass:rgba(18,18,18,.78);--glass-line:rgba(255,255,255,.1);--hover:rgba(255,255,255,.07);--active:rgba(134,188,37,.16);--scrim:rgba(0,0,0,.88);--shadow:0 12px 40px rgba(0,0,0,.6);--p0:#ff8a80;--p1:#efb85c;--p2:#bbbcbc;
  --ease:cubic-bezier(.16,1,.3,1);--sans:"Open Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",Aptos,Helvetica,Arial,sans-serif;--serif:var(--sans)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:6px;background:var(--accent);z-index:70;pointer-events:none}
button,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view{position:fixed;inset:0;opacity:0;visibility:hidden}
.stage{position:absolute;inset:0}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.ov{position:absolute;pointer-events:none}
.mask{display:inline-block;overflow:hidden;vertical-align:top}
.mask>span{display:inline-block;will-change:transform}

/* dock: every section labelled, active one marked in green */
#dock{position:fixed;bottom:18px;left:0;right:0;margin:auto;width:max-content;max-width:calc(100vw - 16px);display:flex;align-items:center;gap:2px;padding:5px;border-radius:12px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--glass-line);box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none}
#dock .mark{font-weight:700;font-size:14px;letter-spacing:-.01em;padding:6px 10px 6px 8px;white-space:nowrap}
#dock .div{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.tab{height:32px;display:flex;align-items:center;gap:5px;padding:0 10px;border-radius:7px;color:var(--mute);font-size:14px;font-weight:600;white-space:nowrap;transition:background .3s var(--ease),color .3s var(--ease)}
.tab .nm{font-size:10px;font-weight:700;color:var(--mute);transform:translateY(-5px)}
.tab:hover{background:var(--hover);color:var(--ink)}
.tab.on{background:var(--active);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.tab.on .nm{color:var(--accent)}
#langBtn{height:32px;display:inline-flex;align-items:center;padding:0 10px;border-radius:7px;font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
#langBtn:hover{background:var(--hover)}
@media (max-width:560px){#dock .mark,#dock .div.first{display:none}.tab{padding:0 7px;font-size:13px}.tab .nm{display:none}#langBtn{padding:0 7px}}

/* gallery */
#g-mark{left:50%;top:50%;width:110px;transform:translate(-50%,-50%);opacity:0}
.g-side{top:50%;transform:translateY(-50%);font-size:13px;white-space:nowrap}
#g-left{left:9%}#g-right{right:9%;color:var(--mute)}
@media (max-width:1024px){.g-side{display:none}}
#g-counter{left:0;right:0;bottom:40px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
#g-caption{left:0;right:0;bottom:100px;text-align:center}
#g-caption .t{font-size:13px;font-weight:600}
#g-caption .c{font-size:13px;color:var(--mute);margin-left:8px}
#g-hint{left:16px;right:16px;bottom:74px;text-align:center;font-size:12px;letter-spacing:.06em;color:var(--mute);opacity:0}
#g-ov{left:0;right:0;margin:auto;bottom:78px;width:calc(100% - 32px);max-width:640px;opacity:0}
#g-ov.open{pointer-events:auto}
.ov-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ov-title{font-size:16px;font-weight:600;line-height:1.4}
.ov-title em{font-style:normal;color:var(--mute);font-weight:400;margin-left:8px;font-size:14px}
.btn{font-size:12.5px;height:28px;padding:0 11px;border-radius:6px;background:var(--pill);border:1px solid var(--line);display:inline-flex;align-items:center;white-space:nowrap;transition:background .3s var(--ease)}
.btn:hover{background:var(--pill-h)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}
.btn.go:hover{background:#9bd23a}
.ov-desc{font-size:15px;line-height:1.6;color:var(--ink2);max-width:60ch;margin:10px 0 12px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:11.5px;padding:4px 8px;border-radius:4px;background:var(--pill);border:1px solid var(--line)}
.tags span.p0{color:var(--p0)}.tags span.p1{color:var(--p1)}
.ov-head .acts{display:flex;gap:6px;flex:none}
#g-cur{position:fixed;left:0;top:0;font-size:12px;font-weight:600;color:#000;background:var(--ink);padding:6px 9px;border-radius:4px;pointer-events:none;z-index:40;opacity:0;transform-origin:0 0;white-space:nowrap}

/* grid views */
#p-bubble{position:fixed;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:#000;background:var(--accent);pointer-events:none;z-index:40;opacity:0;transform:scale(.6)}
.ctrl{position:absolute;top:20px;left:0;right:0;margin:auto;width:max-content;max-width:calc(100vw - 16px);z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px}
.ctrl .ed{display:flex;align-items:center;gap:4px;padding:4px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ctrl .ed label{display:flex;align-items:center;gap:8px;padding:0 6px;font-size:12px;color:var(--mute)}
.ctrl select{background:var(--pill);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.ctrl .nav{width:32px;height:32px;border-radius:7px;font-size:18px;color:var(--ink);display:grid;place-items:center}
.ctrl .nav:hover:not(:disabled){background:var(--hover)}
.ctrl .nav:disabled{opacity:.3;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:min(760px,calc(100vw - 16px))}
.chip{height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--glass);border:1px solid var(--line);color:var(--ink2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);white-space:nowrap}
.chip b{font-weight:700;color:var(--mute);margin-left:5px;font-size:11.5px}
.chip:hover{border-color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#000}
.chip[aria-pressed="true"] b{color:#1b2709}
.gridnote{position:absolute;left:0;right:0;bottom:78px;text-align:center;font-size:12px;color:var(--mute);pointer-events:none}

/* lightbox */
#lb{position:fixed;inset:0;z-index:60;overflow-y:auto;padding:40px 20px 110px;background:var(--scrim);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;visibility:hidden}
#lb .in{width:min(980px,100%);margin:0 auto}
#lb img{display:block;width:100%;max-width:820px;aspect-ratio:16/9;object-fit:contain;border-radius:8px;box-shadow:0 0 0 1px var(--line)}
#lb .meta{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:18px}
#lb .t{font-size:20px;font-weight:700;line-height:1.4;max-width:46ch}
#lb .sub{font-size:13px;color:var(--mute);margin-top:4px}
#lb .acts{display:flex;gap:6px;flex:none}
#lb .d{font-size:16px;line-height:1.7;color:var(--ink2);margin:14px 0 0;max-width:70ch}
#lb .more h4{margin:22px 0 6px;font-size:12px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
#lb .more ul{margin:0;padding-left:20px;max-width:70ch;line-height:1.7;color:var(--ink2);font-size:15px}
#lb .more .bankbox{background:var(--soft);border-left:4px solid var(--accent);border-radius:0 6px 6px 0;padding:10px 14px;max-width:70ch}
#lb .more .bankbox ul{padding-left:18px}
#lb .more p{max-width:70ch;line-height:1.7;color:var(--ink2);font-size:15px;margin:0}
#lb .more .src{display:flex;flex-direction:column;gap:6px;font-size:14px}
#lb .more .src a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
#lb .more .src a.sec::after{content:" (secondary)";color:var(--mute);text-decoration:none}

/* about: a plain, readable page */
#v-about{overflow-y:auto;overscroll-behavior:contain}
.about{max-width:1040px;margin:0 auto;padding:56px 24px 140px}
.a-hero{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:center;min-height:min(560px,calc(100vh - 140px))}
.a-kicker{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.a-hero h1{font-size:44px;line-height:1.15;margin:10px 0 0;font-weight:700;letter-spacing:-.01em}
.a-hero h1 span{display:block;font-size:20px;font-weight:400;color:var(--mute);margin-top:6px;letter-spacing:0}
.a-role{margin:14px 0 0;font-size:14px;font-weight:600;color:var(--accent)}
.a-pitch{margin:22px 0 0;font-size:26px;line-height:1.45;font-weight:300;max-width:24em}
.a-tag{margin:12px 0 0;font-size:15.5px;line-height:1.8;color:var(--ink2);max-width:40em}
.a-cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.a-cta a{height:38px;padding:0 16px;border-radius:8px;display:inline-flex;align-items:center;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--pill)}
.a-cta a.go{background:var(--accent);border-color:var(--accent);color:#000}
.a-cta a:hover{border-color:var(--mute)}
.bot-stage{position:relative;height:420px;cursor:pointer}
.bot-stage canvas{display:block;width:100%;height:100%}
.bot-hint{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:11.5px;color:var(--mute)}
.a-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0 48px}
.a-stats div{background:var(--bg);padding:16px 18px}
.a-stats b{display:block;font-size:30px;font-weight:700;line-height:1.1}
.a-stats span{font-size:13px;color:var(--mute)}
.a-sec{margin:0 0 44px}
.a-sec>h2{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.a-two{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.a-sec p{margin:0 0 10px;font-size:15.5px;line-height:1.8;color:var(--ink2);max-width:62ch}
.a-chipline{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.a-chipline span{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.a-view{display:block;padding:14px 16px;border-radius:8px;background:var(--pill);border:1px solid var(--line);margin-bottom:10px}
.a-view:hover{border-color:var(--accent)}
.a-view small{display:block;font-size:12px;color:var(--accent);font-weight:700;margin-bottom:4px}
.a-view span{font-size:16px;line-height:1.6}
.a-view em{display:block;font-style:normal;font-size:12.5px;color:var(--mute);margin-top:6px}
.a-row{display:grid;grid-template-columns:200px 1fr;gap:18px;padding:14px 0;border-bottom:1px solid var(--line)}
.a-row:last-child{border-bottom:0}
.a-row .when{font-size:13px;color:var(--mute);line-height:1.6}
.a-row .what b{display:block;font-size:16px;font-weight:700}
.a-row .what i{display:block;font-style:normal;font-size:14px;color:var(--accent);margin-top:2px}
.a-row .what p{margin:6px 0 0;font-size:14.5px;line-height:1.7;color:var(--ink2)}
.a-work{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.a-work div{padding:14px 16px;border-radius:8px;border:1px solid var(--line)}
.a-work b{display:block;font-size:15px}
.a-work span{display:block;font-size:13.5px;line-height:1.65;color:var(--mute);margin-top:4px}
.a-contact a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:15.5px}
.a-note{font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:820px){.a-hero{grid-template-columns:1fr;min-height:0}.bot-stage{height:300px;order:-1}.a-two,.a-work{grid-template-columns:1fr}.a-stats{grid-template-columns:repeat(2,1fr)}.a-row{grid-template-columns:1fr;gap:4px}.a-hero h1{font-size:34px}.a-pitch{font-size:22px}.about{padding-top:36px}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>

      const w = m.aspect >= 1 ? s : s * m.aspect, h = m.aspect >= 1 ? s / m.aspect : s;
      m.mesh.position.set(px(P.x), px(P.y), px(P.z));
      m.mesh.scale.set(px(w), px(h), 1);
      m.mesh.quaternion.copy(invQ);
      m.mat.opacity = o; m.mesh.visible = o > .002;
    });
    if (hoverPending && phase === 'sphere'){
      hoverPending = false;
      const h = ptr.x > -1e3 ? pick(ptr.x, ptr.y) : null;
      if (!zoomed) setCaption(h); else setCaption(zoomed);
      const dc = Math.hypot(ptr.x - W / 2, ptr.y - H / 2);
      canvas.style.cursor = ptr.down && ptr.path > 6 ? 'grabbing' : h ? 'pointer' : dc < 250 ? 'grab' : 'default';
      showCur(!!(zoomed && h === zoomed && ze.v > .5));
    }
    renderer.render(scene, camera);
  }
  return {
    start(){
      if (running) return; running = true; frame();
      if (!started){ started = true; reduced ? skipIntro() : runIntro(); }
    },
    stop(){ running = false; cancelAnimationFrame(raf); showCur(false); items.forEach(m => setPlay(m, false)); },
    get introDone(){ return introDone; },
    resize(){ layout(); },
    esc(){ collapseZoom(); }
  };
}


// =====================================================================
// VIEWS 2 & 3 — DAILY BRIEF and FEATURES (WebGL grid)
// =====================================================================
const VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
async function initGrid(cfg){
  await fontsReady;
  const root = cfg.root, stage = root.querySelector('.stage');
  const renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setPixelRatio(DPR); renderer.setClearColor(BG, 1);
  stage.appendChild(renderer.domElement);
  const canvas = renderer.domElement;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 1, 20000);
  const blank = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1); blank.needsUpdate = true;
  const plane = new THREE.PlaneGeometry(1, 1);
  const cache = new Map();
  const mediaOf = it => { if (!cache.has(it.key)) cache.set(it.key, {...it, video: null, still: null, vtex: null, loading: false, reveal: {v: 0}, mix: {v: 0}, playing: false}); return cache.get(it.key); };
  let media = [];

  // post pass
  let rt = null;
  const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const postMat = new THREE.ShaderMaterial({
    uniforms: {tDiffuse: {value: null}},
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
      void main(){
        vec2 uv = vUv; const float band = 0.08; float t = 0.0; float dir = 0.0;
        if (uv.y < band){ t = (band - uv.y) / band; dir = 1.0; }
        else if (uv.y > 1.0 - band){ t = (uv.y - (1.0 - band)) / band; dir = -1.0; }
        vec3 col;
        if (t > 0.0){
          float sag = 1.0 - sqrt(max(0.0, 1.0 - t * t));
          vec2 s = uv; s.y += dir * sag * band * 1.0;
          vec3 acc = vec3(0.0); vec3 ws = vec3(0.0);
          for (int i = 0; i < 16; i++){
            float f = float(i) / 15.0;
            float off = (f - 0.5) * 0.01 * sag * 30.0 * (t - 0.5) * dir;
            vec3 w = vec3(smoothstep(0.8, 0.2, f), smoothstep(0.0, 0.5, f) * smoothstep(1.0, 0.5, f), smoothstep(0.2, 0.8, f));
            acc += texture2D(tDiffuse, vec2(s.x, clamp(s.y + off, 0.001, 0.999))).rgb * w; ws += w;
          }
          col = acc / ws;
        } else col = texture2D(tDiffuse, uv).rgb;
        gl_FragColor = linearToOutputTexel(vec4(col, 1.0));
      }`,
    depthTest: false, depthWrite: false
  });
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

  const SKEL = TH.skel.toFixed(3), SHIM = TH.shim.toFixed(3), CHIP = TH.chip.toFixed(3);
  const tileFS = `uniform sampler2D uTex, uTex2; uniform float uMix, uReveal, uTime, uAlpha; varying vec2 vUv;
    void main(){
      vec3 sk = vec3(${SKEL}); float sweep = fract(uTime * 0.6);
      sk += smoothstep(0.18, 0.0, abs((vUv.x + (1.0 - vUv.y)) * 0.5 - sweep)) * (${SHIM});
      vec3 m = mix(texture2D(uTex, vUv).rgb, texture2D(uTex2, vUv).rgb, uMix);
      gl_FragColor = vec4(mix(sk, m, uReveal), uAlpha);
    }`;
  const chipFS = `uniform sampler2D uTex, uTex2, uLabel; uniform float uMix, uReveal, uAlpha; uniform vec2 uTile, uPos, uSize; varying vec2 vUv;
    vec3 media(vec2 uv){ return mix(texture2D(uTex, uv).rgb, texture2D(uTex2, uv).rgb, uMix); }
    void main(){
      vec2 p = uPos + vec2(vUv.x, 1.0 - vUv.y) * uSize;
      vec2 tuv = vec2(p.x / uTile.x, 1.0 - p.y / uTile.y);
      vec3 acc = vec3(0.0);
      for (int i = 0; i < 32; i++){
        float fi = float(i); float r = sqrt((fi + 0.5) / 32.0) * 40.0; float th = fi * 2.39996323;
        acc += media(clamp(tuv + vec2(cos(th), sin(th)) * r / uTile, 0.001, 0.999));
      }
      acc /= 32.0;
      vec3 col = mix(vec3(${SKEL}), acc, uReveal);
      col = mix(col, vec3(${CHIP}), 0.45);
      vec4 l = texture2D(uLabel, vUv); col = mix(col, l.rgb, l.a);
      vec2 q = abs((vUv - 0.5) * uSize) - (uSize * 0.5 - 4.0);
      float sd = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - 4.0;
      gl_FragColor = vec4(col, uAlpha * clamp(0.5 - sd, 0.0, 1.0));
    }`;

  let W = 1, H = 1, cols = 3, tileW = 1, tileH = 1, pageH = 1, maxScroll = 0;
  let tiles = [], texts = [], headline = null, footer = [];
  const scroll = {y: 0, target: 0, vel: 0};
  let built = false, entered = false;

  function textMesh(text, font, color, ls = '0px', h){
    const w = Math.ceil(measure(font, text, ls)) + 4; h = h || Math.ceil(parseFloat(font.match(/(\d+)px/)[1]) * 1.4);
    const tc = textCanvas(w, h, ctx => { ctx.font = font; ctx.letterSpacing = ls; ctx.fillStyle = color; ctx.textBaseline = 'middle'; ctx.fillText(text, 2, h / 2 + 1); });
    const mat = new THREE.MeshBasicMaterial({map: tc.t, transparent: true, depthWrite: false, opacity: 0});
    const mesh = new THREE.Mesh(plane, mat); mesh.scale.set(w, h, 1);
    return {mesh, mat, w, h};
  }
  const place = (o, x, y) => o.mesh.position.set(x + o.w / 2, -(y + o.h / 2), 0);

  // headline with scramble
  const GLY = '.:·,;_';
  function buildHeadline(){
    const phone = W <= 640;
    const fA = `500 16px ${SANS}`, fB = `400 17px ${SERIF}`;
    const pick = a => a.map(line => line.map(([txt, k]) => [txt, k === 'a' ? fA : fB, k === 'a' ? '-0.16px' : '0px']));
    const segs = pick(cfg.head(phone));
    const hh = phone ? 44 : 24;
    const chars = [];
    segs.forEach((line, li) => {
      const lw = line.reduce((s, [t, f, ls]) => s + measure(f, t, ls), 0);
      let x = (W - lw) / 2;
      line.forEach(([t, f, ls]) => { for (const ch of t){ const cw = measure(f, ch, ls); chars.push({ch, f, ls, x, y: 12 + li * 20, r: Math.random()}); x += cw; } });
    });
    chars.forEach((c, j) => c.thr = .7 * j / chars.length + .3 * c.r);
    const tc = textCanvas(W, hh, null);
    const mat = new THREE.MeshBasicMaterial({map: tc.t, transparent: true, depthWrite: false, opacity: 0});
    const mesh = new THREE.Mesh(plane, mat); mesh.scale.set(W, hh, 1);
    const o = {mesh, mat, w: W, h: hh, p: {v: reduced ? 1 : 0},
      draw(){ const ctx = tc.ctx; ctx.clearRect(0, 0, W, hh); ctx.fillStyle = INK; ctx.textBaseline = 'middle';
        chars.forEach(c => { ctx.font = c.f; ctx.letterSpacing = c.ls; const ch = (o.p.v > c.thr || c.ch === ' ') ? c.ch : GLY[(Math.random() * GLY.length) | 0]; ctx.fillText(ch, c.x, c.y); });
        tc.t.needsUpdate = true; }};
    o.draw(); return o;
  }

  function build(){
    tiles.forEach(t => { scene.remove(t.mesh, t.chip, t.title.mesh, t.cat.mesh); });
    if (headline) scene.remove(headline.mesh); footer.forEach(f => scene.remove(f.mesh));
    W = innerWidth; H = innerHeight;
    renderer.setSize(W, H, false);
    if (rt) rt.dispose();
    rt = new THREE.WebGLRenderTarget(Math.floor(W * DPR), Math.floor(H * DPR), {samples: 4, type: THREE.HalfFloatType});
    cols = W > 1024 ? 3 : W > 640 ? 2 : 1;
    tileW = (W - 16 - (cols - 1) * 8) / cols; tileH = tileW * 9 / 16;
    camera.aspect = W / H; camera.updateProjectionMatrix();
    headline = buildHeadline(); place(headline, 0, 200); scene.add(headline.mesh);
    const gridTop = 200 + headline.h + 80;
    const rowStep = tileH + 12 + 16 + 6 + 18 + 40;
    media = cfg.items().map(mediaOf);
    tiles = media.map((m, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const x = 8 + col * (tileW + 8), y = gridTop + row * rowStep;
      const u = {uTex: {value: m.still || blank}, uTex2: {value: m.vtex || blank}, uMix: {value: m.mix.v}, uReveal: {value: m.reveal.v}, uTime: {value: 0}, uAlpha: {value: 0}};
      const mesh = new THREE.Mesh(plane, new THREE.ShaderMaterial({uniforms: u, vertexShader: VS, fragmentShader: tileFS, transparent: true, depthWrite: false}));
      mesh.scale.set(tileW, tileH, 1);
      const label = String(i + 1).padStart(2, '0') + '  ' + m.cat, lf = `500 12px ${SANS}`;
      const lw = Math.ceil(measure(lf, label)), cw = lw + 16, ch = 22;
      const lt = textCanvas(cw, ch, ctx => { ctx.font = lf; ctx.fillStyle = INK; ctx.textBaseline = 'alphabetic'; ctx.fillText(label, 8, 15); });
      const cu = {uTex: u.uTex, uTex2: u.uTex2, uMix: u.uMix, uReveal: u.uReveal, uAlpha: {value: 0}, uLabel: {value: lt.t}, uTile: {value: new THREE.Vector2(tileW, tileH)}, uPos: {value: new THREE.Vector2(8, 8)}, uSize: {value: new THREE.Vector2(cw, ch)}};
      const chip = new THREE.Mesh(plane, new THREE.ShaderMaterial({uniforms: cu, vertexShader: VS, fragmentShader: chipFS, transparent: true, depthWrite: false}));
      chip.scale.set(cw, ch, 1); chip.renderOrder = 1;
      const title = textMesh(m.title, `500 12px ${SANS}`, INK, '0px', 16);
      const cat = textMesh(`${m.cat}, ${m.year}`, `400 13px ${SERIF}`, MUTE, '0px', 18);
      const t = {m, i, col, row, x, y, mesh, chip, title, cat, u, cu, cw, ch, st: {a: entered ? 1 : 0, dy: entered ? 0 : 60}};
      scene.add(mesh, chip, title.mesh, cat.mesh);
      return t;
    });
    const rows = Math.ceil(media.length / cols);
    const lastBottom = gridTop + (rows - 1) * rowStep + tileH + 12 + 16 + 6 + 18;
    const fy = lastBottom + 240, ff = `400 13px ${SERIF}`;
    footer = W <= 640 ? [textMesh(LP.footerPhone[0], ff, MUTE), textMesh(LP.footerPhone[1], ff, MUTE)] : [textMesh(LP.footer, ff, MUTE)];
    if (footer.length === 2){ place(footer[0], 8, fy); place(footer[1], W - 8 - footer[1].w, fy); } else place(footer[0], (W - footer[0].w) / 2, fy);
    footer.forEach(f => { f.mat.opacity = 1; scene.add(f.mesh); });
    pageH = fy + 20 + 110; maxScroll = Math.max(0, pageH - H);
    scroll.target = clamp(scroll.target, 0, maxScroll); scroll.y = clamp(scroll.y, 0, maxScroll);
    built = true;
  }

  function enter(){
    if (entered) return; entered = true;
    if (reduced){ headline.p.v = 1; headline.mat.opacity = 1; headline.draw(); tiles.forEach(t => { t.st.a = 1; t.st.dy = 0; }); return; }
    gsap.to(headline.mat, {opacity: 1, duration: .3});
    gsap.to(headline.p, {v: 1, duration: 1.1, ease: 'power2.out'});
    tiles.forEach(t => {
      const d = .35 + .08 * t.col + .06 * t.row;
      gsap.to(t.st, {a: 1, duration: .9, ease: 'power2.out', delay: d});
      gsap.to(t.st, {dy: 0, duration: 1.2, ease: 'expo.out', delay: d});
    });
  }

  function load(m){
    if (m.loading) return; m.loading = true;
    fontsReady.then(() => {
      m.still = cardTexture(m); m.vtex = cardTexture(m, true);
      const t = tiles.find(x => x.m === m); if (t){ t.u.uTex.value = m.still; t.u.uTex2.value = m.vtex; }
      gsap.to(m.reveal, {v: 1, duration: .8, ease: 'power2.out'});
    });
  }
  function play(m, on){
    if (on === m.playing) return; m.playing = on;
    if (on){ if (m.video){ m.video.play().catch(() => {}); } gsap.to(m.mix, {v: 1, duration: .45, ease: 'power2.out', overwrite: true}); }
    else gsap.to(m.mix, {v: 0, duration: .45, ease: 'power2.out', overwrite: true, onComplete: () => { if (!m.playing && m.video) m.video.pause(); }});
  }

  // input
  const bubble = $('#p-bubble');
  const bx = gsap.quickTo(bubble, 'x', {duration: .5, ease: 'power3.out'}), by = gsap.quickTo(bubble, 'y', {duration: .5, ease: 'power3.out'});
  let bubbleOn = false;
  function showBubble(on){ if (on === bubbleOn) return; bubbleOn = on; gsap.to(bubble, {opacity: on ? 1 : 0, scale: on ? 1 : .6, duration: on ? .75 : .6, ease: 'power4.out', overwrite: 'auto'}); }
  const ptr = {x: -1, y: -1, in: false};
  let drag = null;
  canvas.addEventListener('wheel', e => { e.preventDefault(); const k = e.deltaMode === 1 ? 16 : 1; scroll.target = clamp(scroll.target + e.deltaY * k, 0, maxScroll); }, {passive: false});
  canvas.addEventListener('pointerdown', e => {
    drag = {x: e.clientX, y: e.clientY, ly: e.clientY, path: 0, t: performance.now(), touch: e.pointerType !== 'mouse'};
    scroll.vel = 0; canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.in = true; bx(e.clientX); by(e.clientY);
    if (drag){
      const dy = e.clientY - drag.ly; drag.ly = e.clientY; drag.path += Math.abs(dy) + 0;
      if (drag.touch){ scroll.target = clamp(scroll.target - dy, 0, maxScroll); scroll.vel = -dy; }
    }
  });
  canvas.addEventListener('pointerup', e => {
    if (!drag) return;
    const moved = Math.hypot(e.clientX - drag.x, e.clientY - drag.y);
    if (moved < 6 && drag.path < 10){ const t = tileAt(e.clientX, e.clientY); if (t) openLB(t.m); }
    else if (!drag.touch) scroll.vel = 0;
    drag = null;
  });
  canvas.addEventListener('pointerleave', () => { ptr.in = false; });
  function tileAt(x, y){
    const wx = x, wy = y + scroll.y;
    return tiles.find(t => wx >= t.x && wx <= t.x + tileW && wy >= t.y && wy <= t.y + tileH);
  }

  const openLB = m => { showBubble(false); openLightbox(m); }, closeLB = closeLightbox;

  // loop
  let running = false, raf = 0; const clock = new THREE.Clock();
  function frame(){
    raf = requestAnimationFrame(frame);
    const time = clock.getElapsedTime();
    if (!drag || !drag.touch){ if (Math.abs(scroll.vel) > .05){ scroll.target = clamp(scroll.target + scroll.vel, 0, maxScroll); scroll.vel *= .95; } else scroll.vel = 0; }
    scroll.y += (scroll.target - scroll.y) * .12;
    scroll.y = clamp(scroll.y, 0, maxScroll);
    const d = (H / 2) / Math.tan(THREE.MathUtils.degToRad(17.5));
    camera.position.set(W / 2, -H / 2 - scroll.y, d); camera.lookAt(W / 2, -H / 2 - scroll.y, 0);
    if (entered && headline.p.v !== headline.drawn){ headline.drawn = headline.p.v; headline.draw(); }
    const desktopHover = !isTouch && W > 1024;
    const hov = desktopHover && ptr.in && !lbIsOpen() ? tileAt(ptr.x, ptr.y) : null;
    let centerT = null;
    if (!desktopHover){ const cy = scroll.y + H / 2; let best = 1e9; tiles.forEach(t => { const dd = Math.abs(t.y + tileH / 2 - cy); if (dd < best){ best = dd; centerT = t; } }); }
    showBubble(!!hov);
    canvas.style.cursor = hov ? 'pointer' : 'default';
    tiles.forEach(t => {
      const m = t.m, top = t.y, bot = t.y + tileH;
      if (!m.loading && top < scroll.y + H + 1.6 * H && bot > scroll.y - .6 * H) load(m);
      play(m, (hov === t || centerT === t) && !!m.still);
      const yy = t.y + t.st.dy;
      t.mesh.position.set(t.x + tileW / 2, -(yy + tileH / 2), 0);
      t.chip.position.set(t.x + 8 + t.cw / 2, -(yy + 8 + t.ch / 2), .1);
      place(t.title, t.x - 2, yy + tileH + 12 - 2); place(t.cat, t.x - 2, yy + tileH + 12 + 16 + 6 - 4);
      t.u.uAlpha.value = t.cu.uAlpha.value = t.st.a; t.title.mat.opacity = t.cat.mat.opacity = t.st.a;
      t.u.uMix.value = m.mix.v; t.u.uReveal.value = m.reveal.v; t.u.uTime.value = time;
    });
    renderer.setRenderTarget(rt); renderer.render(scene, camera);
    renderer.setRenderTarget(null); postMat.uniforms.tDiffuse.value = rt.texture; renderer.render(postScene, postCam);
  }
  build();
  return {
    start(){ if (running) return; running = true; clock.start(); frame(); enter(); },
    stop(){ running = false; cancelAnimationFrame(raf); showBubble(false); closeLB(); media.forEach(m => { if (m.playing) play(m, false); }); },
    resize(){ build(); },
    esc(){ closeLB(); },
    rebuild(){ entered = false; scroll.target = scroll.y = 0; build(); if (running) enter(); }
  };
}

  [['all', LP.all, list.length]].concat(Object.keys(counts).map(r => [r, r, counts[r]])).forEach(([key, label, n]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';

    <p class="a-note">${LP.note}</p>`;

  // ---------- bot ----------
  const stage = wrap.querySelector('.bot-stage');
  const renderer = new THREE.WebGLRenderer({antialias: true, alpha: false});
  renderer.setPixelRatio(DPR); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping; renderer.setClearColor(BG, 1);
  stage.insertBefore(renderer.domElement, stage.firstChild);
  const canvas = renderer.domElement;

  const camera = new THREE.PerspectiveCamera(45, 1, .1, 100); camera.position.z = 13;
  const room = new THREE.Scene(); room.background = new THREE.Color(0x0a0a0b);
  room.add(new THREE.Mesh(new THREE.BoxGeometry(24, 16, 24), new THREE.MeshBasicMaterial({color: 0x0a0a0b, side: THREE.BackSide})));
  const panel = (w, h, k, pos, rot) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color: new THREE.Color(k, k, k), side: THREE.DoubleSide})); m.position.set(...pos); if (rot) m.rotation.set(...rot); room.add(m); };
  panel(14, 5, 1.1, [0, 6, 0], [Math.PI / 2, 0, 0]); panel(3.2, 10, 1.0, [-6, 0, 0], [0, Math.PI / 2, 0]); panel(2.4, 10, .85, [6, 0, 0], [0, -Math.PI / 2, 0]);
  panel(12, 2.2, .6, [0, -1.5, -6]); panel(5, 4, .8, [3, 2.5, 6], [0, Math.PI, 0]); panel(14, 6, .22, [0, -6, 0], [-Math.PI / 2, 0, 0]);
  const env = new THREE.PMREMGenerator(renderer).fromScene(room, .04).texture;
  const U = {uReveal: {value: reduced ? 1 : 0}, uMinY: {value: -1}, uMaxY: {value: 1}, uBand: {value: .97}, uTime: {value: 0}, uHit: {value: new THREE.Vector3(0, 0, -100)}, uHover: {value: 0}, uInvBot: {value: new THREE.Matrix4()}};
  function patch(mat){
    mat.onBeforeCompile = sh => {
      Object.assign(sh.uniforms, U);
      sh.vertexShader = 'uniform mat4 uInvBot;\nvarying vec3 vWP;\nvarying vec3 vBP;\n' + sh.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\n{ vec4 _w = modelMatrix * vec4(transformed, 1.0); vWP = _w.xyz; vBP = (uInvBot * _w).xyz; }');
      sh.fragmentShader = `uniform float uReveal, uMinY, uMaxY, uBand, uTime, uHover; uniform vec3 uHit; varying vec3 vWP; varying vec3 vBP;
float _h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float _vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(_h21(i), _h21(i + vec2(1, 0)), f.x), mix(_h21(i + vec2(0, 1)), _h21(i + vec2(1, 1)), f.x), f.y); }
float _front(){ return mix(uMinY - uBand, uMaxY + 0.25 * uBand, uReveal) + (_vn(vec2(vBP.x * 1.7 + uTime * 0.35, vBP.z * 1.7 - uTime * 0.25)) - 0.5) * 0.95 * (1.0 - uReveal); }
` + sh.fragmentShader.replace('void main() {', 'void main() {\n float _fy = _front(); if (vBP.y > _fy) discard;').replace('#include <dithering_fragment>', `#include <dithering_fragment>
{ float t = clamp((_fy - vBP.y) / uBand, 0.0, 1.0); float fade = 1.0 - smoothstep(0.9, 1.0, uReveal);
  gl_FragColor.rgb = mix(gl_FragColor.rgb, mix(gl_FragColor.rgb * 1.35 + 0.08, vec3(${TH.liquid.join(', ')}), 0.4), (1.0 - t) * fade);
  gl_FragColor.rgb += vec3(${TH.glow.join(', ')}) * pow(1.0 - t, 3.0) * 1.4 * (0.7 + 0.3 * sin(uTime * 7.0 + vBP.x * 9.0)) * fade * 0.55;
  float g = pow(1.0 - smoothstep(0.828, 1.352, length(vWP - uHit)), 3.0) * 0.4 * uHover;
  gl_FragColor.rgb += vec3(${TH.glow.join(', ')}) * g; }`);
    };
    mat.customProgramCacheKey = () => 'botfx'; return mat;
  }
  const chrome = patch(new THREE.MeshPhysicalMaterial({color: 0xffffff, metalness: 1, roughness: .07, envMap: env}));
  const dark = patch(new THREE.MeshPhysicalMaterial({color: 0x040405, metalness: .3, roughness: .12, clearcoat: 1, clearcoatRoughness: .04, envMap: env}));
  const eyeMat = patch(new THREE.MeshBasicMaterial({color: 0xf2f2ee}));
  const inner = new THREE.Group();
  const head = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), chrome); head.scale.set(1.1, 1, .98); inner.add(head);
  const visor = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 48, Math.PI / 2 - 1.02, 2.04, Math.PI / 2 - .5, 1.0), dark); visor.scale.set(1.1 * 1.015, 1.015, .98 * 1.015); inner.add(visor);
  const eyes = [-.3, .3].map(x => { const ax = 1.1 * 1.015, ay = 1.015, az = .98 * 1.015, y = .03; const e = new THREE.Mesh(new THREE.CapsuleGeometry(.075, .2, 8, 16), eyeMat); e.position.set(x, y, az * Math.sqrt(Math.max(0, 1 - (x / ax) ** 2 - (y / ay) ** 2))); e.scale.z = .45; inner.add(e); return e; });
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.022, .03, .42, 24), chrome); stem.position.y = 1.15; inner.add(stem);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(.095, 32, 24), chrome); ball.position.y = 1.38; inner.add(ball);
  [-1.1, 1.1].forEach(x => { const ear = new THREE.Mesh(new THREE.TorusGeometry(.2, .065, 24, 64), chrome); ear.position.x = x; ear.rotation.y = Math.PI / 2; inner.add(ear); const c = new THREE.Mesh(new THREE.CylinderGeometry(.15, .15, .06, 40), dark); c.position.x = x; c.rotation.z = Math.PI / 2; inner.add(c); });
  const haloPivot = new THREE.Group(); haloPivot.position.y = -1.28; haloPivot.rotation.x = .92 * Math.PI / 2; inner.add(haloPivot);
  const halo = new THREE.Mesh(new THREE.TorusGeometry(.78, .05, 24, 160), chrome); haloPivot.add(halo);
  const box = new THREE.Box3().setFromObject(inner), bsz = box.getSize(new THREE.Vector3());
  U.uMinY.value = box.min.y; U.uMaxY.value = box.max.y; inner.position.copy(box.getCenter(new THREE.Vector3())).negate();
  const pivot = new THREE.Group(); pivot.add(inner); const bot = new THREE.Group(); bot.add(pivot); scene.add(bot);
  const botMeshes = []; inner.traverse(o => { if (o.isMesh) botMeshes.push(o); });

  let SW = 1, SH = 1;
  function layout(){ SW = stage.clientWidth || 1; SH = stage.clientHeight || 1; renderer.setSize(SW, SH, false); camera.aspect = SW / SH; camera.updateProjectionMatrix(); bot.scale.setScalar(.72 * (2 * 13 * Math.tan(THREE.MathUtils.degToRad(22.5))) / bsz.y); }
  layout();

  const tgt = {x: -.3, y: .4, z: .1}, rot = {...tgt}, rx = {x: 0, y: 0, z: 0}, sh = {y: 0}, eye = {blink: 1, sq: 1, sleep: 1}, fl = {phase: 0, y: 0, speed: 1, amp: 1};
  let freeze = false, sleeping = false, lastInput = performance.now(), reactN = 0, visits = 0, hoverOn = false;
  (function blinkLoop(){ setTimeout(() => { if (!sleeping) gsap.to(eye, {blink: .1, duration: .09, yoyo: true, repeat: 1}); blinkLoop(); }, 3000 + Math.random() * 2000); })();
  const shake = () => gsap.timeline().to(sh, {y: .22, duration: .09}).to(sh, {y: -.18, duration: .12}).to(sh, {y: .10, duration: .11}).to(sh, {y: 0, duration: .18});
  function sleep(){ sleeping = true; gsap.to(eye, {sleep: .2, duration: 1.1, ease: 'power2.inOut'}); gsap.to(tgt, {x: .42, y: 0, z: .12, duration: 1.4, ease: 'power2.inOut'}); gsap.to(fl, {speed: .35, amp: 1.6, duration: 1.6}); }
  function wake(){ if (!sleeping) return; sleeping = false; gsap.killTweensOf(tgt); gsap.to(fl, {speed: 1, amp: 1, duration: .8}); gsap.killTweensOf(eye, 'sleep'); eye.sleep = 1; shake(); }
  const onInput = () => { lastInput = performance.now(); wake(); };
  ['pointerdown', 'wheel', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, () => { if (current === 'about') onInput(); }, {passive: true}));
  root.addEventListener('scroll', () => { if (current === 'about') onInput(); }, {passive: true});
  window.addEventListener('mousemove', e => {
    if (current !== 'about') return; onInput();
    const r = canvas.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (!sleeping){ tgt.x = clamp((e.clientY - cy) / (innerHeight / 2), -.62, .62); tgt.y = clamp((e.clientX - cx) / (innerWidth / 2), -.59, .59); tgt.z = .2 * clamp((e.clientX - cx) / (innerWidth / 2), -1, 1); }
    ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    hoverOn = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  });
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(9, 9);
  canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera); if (!ray.intersectObjects(botMeshes, false).length || freeze || U.uReveal.value < .8) return;
    freeze = true;
    const tl = gsap.timeline({onComplete: () => { freeze = false; shake(); }});
    if (reactN++ % 2 === 0) tl.to(rx, {x: -.45, y: .18, duration: .16, ease: 'power3.out'}).to(eye, {sq: .35, duration: .16}, 0).to(rx, {x: 0, y: 0, duration: .9, ease: 'elastic.out(1, .45)'}).to(eye, {sq: 1, duration: .3}, '<');
    else tl.to(rx, {y: Math.PI * 2, duration: 1.1, ease: 'power3.inOut'}).to(rx, {z: .25, duration: .25, ease: 'power2.out'}, 0).to(rx, {z: 0, duration: .9, ease: 'elastic.out(1, .5)'}, .25).set(rx, {y: 0});
  });

  let running = false, raf = 0, last = performance.now();
  function frame(now){
    raf = requestAnimationFrame(frame);
    const dt = Math.min(.05, ((now || performance.now()) - last) / 1000); last = now || performance.now();
    U.uTime.value += dt;
    const k = 1 - Math.pow(1 - .08, 60 * dt);
    if (!isTouch && !sleeping && U.uReveal.value >= 1 && performance.now() - lastInput > 30000) sleep();
    if (!freeze){ rot.x += (tgt.x - rot.x) * k; rot.y += (tgt.y - rot.y) * k; rot.z += (tgt.z - rot.z) * k; }
    pivot.rotation.set(rot.x + rx.x, rot.y + rx.y + sh.y, rot.z + rx.z);
    if (!reduced){ fl.phase += dt * 1.5 * fl.speed; fl.y += (Math.sin(fl.phase) * .2 * fl.amp * U.uReveal.value - fl.y) * k; }
    bot.position.y = fl.y; halo.rotation.z += .35 * dt;

    if (hit){ U.uHit.value.copy(hit.point); U.uHover.value += (1 - U.uHover.value) * .1; } else U.uHover.value += (0 - U.uHover.value) * .05;

  }
  return {
    start(){
      if (running) return; running = true; last = performance.now(); layout(); raf = requestAnimationFrame(frame); visits++; root.scrollTop = 0;
      if (!reduced){ U.uReveal.value = 0; gsap.to(U.uReveal, {value: 1, duration: 3.85, ease: 'power2.out', delay: visits === 1 ? .6 : .3, overwrite: true}); }
      gsap.fromTo(wrap.querySelectorAll('.a-hero > div:first-child > *'), {y: 18, opacity: 0}, {y: 0, opacity: 1, duration: .9, ease: 'expo.out', stagger: .06});
      lastInput = performance.now();
    },
    stop(){ running = false; cancelAnimationFrame(raf); },
    resize(){ layout(); },
    esc(){}
  };
}

// =====================================================================
// ROUTER + DOCK
// =====================================================================
const dock = $('#dock');
let dockShown = false;
function showDock(){ if (dockShown) return; dockShown = true; gsap.fromTo(dock, {y: 16, opacity: 0}, {y: 0, opacity: 1, duration: .9, ease: 'expo.out', onStart: () => dock.style.pointerEvents = 'auto'}); }
const VIEWS = {
  gallery: {el: $('#v-gallery'), init: () => initGallery(), api: null},
  daily: {el: $('#v-daily'), init: () => initGrid(DAILY_CFG), api: null},
  features: {el: $('#v-features'), init: () => initGrid(FEAT_CFG), api: null},
  about: {el: $('#v-about'), init: () => initAbout(), api: null}
};
let current = null, routeToken = 0;
function parseHash(){ let h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { h = location.hash.slice(1); } h = h.replace(/^en-?/, ''); if (h === 'views') h = 'about'; const [v, ...ps] = h.split('/'); return {view: VIEWS[v] ? v : 'gallery', ps}; }
function applyParams(view, ps){
  if (view !== 'daily') return;
  const date = DATA.editions.includes(ps[0]) ? ps[0] : DATA.editions[0];
  let region = ps[1] && ps[1] !== 'all' ? ps[1] : 'all';
  if (region !== 'all' && !edStories(date).some(s => s.region === region)) region = 'all';
  const changed = date !== daily.date || region !== daily.region;
  daily.date = date; daily.region = region; renderCtrl();
  if (changed && VIEWS.daily.api) VIEWS.daily.api.rebuild();
  if (ps[2] !== undefined){ const s = STORIES.find(x => x.date === date && String(x.i) === ps[2]); if (s) setTimeout(() => openLightbox(s), changed ? 450 : 50); }
}
async function route(){
  if (LP.zh && /^#en(-|$)/.test(location.hash)){ location.replace('index-en.html#' + location.hash.slice(1).replace(/^en-?/, '')); return; }
  const {view: next, ps} = parseHash();
  document.querySelectorAll('.tab').forEach(t => { const on = t.dataset.v === next; t.classList.toggle('on', on); if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  if (next === current){ applyParams(next, ps); return; }
  closeLightbox();
  const token = ++routeToken; const prev = current; current = next;
  applyParams(next, ps);
  if (prev){ const p = VIEWS[prev]; await new Promise(r => gsap.to(p.el, {opacity: 0, duration: .3, ease: 'power2.in', overwrite: true, onComplete: r})); p.api && p.api.stop(); p.el.style.visibility = 'hidden'; }
  if (token !== routeToken) return;
  const v = VIEWS[next];
  v.el.style.visibility = 'visible';
  if (!v.api) v.api = await v.init();
  if (token !== routeToken) return;
  v.api.start();
  gsap.to(v.el, {opacity: 1, duration: .45, ease: 'power2.out', overwrite: true});
  if (next !== 'gallery' || v.api.introDone) showDock();
}
window.addEventListener('hashchange', route);
window.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (lbIsOpen()) closeLightbox(); else { const v = VIEWS[current]; v && v.api && v.api.esc && v.api.esc(); } } });
let rTimer = 0;
window.addEventListener('resize', () => { clearTimeout(rTimer); rTimer = setTimeout(() => Object.values(VIEWS).forEach(v => v.api && v.api.resize()), 60); });
const langBtn = $('#langBtn'); langBtn.addEventListener('click', () => { langBtn.href = langBtn.getAttribute('href').split('#')[0] + location.hash; });
// links shared from the old site: #en-… goes to the English page
if (LP.zh && /^#en(-|$)/.test(location.hash)) location.replace('index-en.html#' + location.hash.slice(1).replace(/^en-?/, ''));
else route();
